[workspace]
resolver = "2"
members = ["crates/ubot-core", "crates/ubot-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AstreoX"]
repository = "https://github.com/AstreoX/uBotManager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
sysinfo = "0.37"
trash = "5"
dirs = "6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
